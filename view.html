<!doctype html>
<!-- Mobile view of the SET50 Options dashboard — meant to be opened with the PC off.
     Everything comes from the ledger repo on GitHub (through the relay, which holds the
     read-only token):
       payoff_hist/<acct>/<YYYY-MM>.json — one snapshot per trading day, holding the
         As-of payoff curve ALREADY COMPUTED on the PC (pts), F/T, legs, position
         entries, greeks/BE, M2M, plus that day's own deals (todayLegs/todayFut/…)
       mobile/<acct>.json — the evening settle bundle (still served by /api/bundle)
     No fixed schedule: whatever has been published when you open is what you see. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SET50 Options · mobile</title>
<link rel="manifest" href="/view.webmanifest">
<link rel="icon" type="image/png" href="/view-icon-192.png">
<link rel="apple-touch-icon" href="/view-icon-192.png">
<meta name="theme-color" content="#0d1520">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { --bg:#0d1520; --card:#13202e; --line:#22384e; --tx:#d7e3ee; --dim:#7d93a8;
          --green:#37d07c; --red:#ff6b6b; --amber:#ffc95c; --blue:#5aa7e0; }
  * { box-sizing:border-box; margin:0; }
  /* ⚠️ ต้องมีบรรทัดนี้: .acct และ .day-row ตั้ง display เอง ซึ่ง "ชนะ" display:none ที่มากับ
     แอตทริบิวต์ hidden (UA stylesheet) → ปุ่ม/ตัวเลือกวันโผล่มาเปล่า ๆ ตั้งแต่ยังไม่มีข้อมูล */
  [hidden] { display:none !important; }
  body { background:var(--bg); color:var(--tx); font:14px/1.45 system-ui,sans-serif; padding:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:10px 12px; margin-bottom:10px; }
  h1 { font-size:15px; margin-bottom:2px; }
  .dim { color:var(--dim); font-size:12px; overflow-wrap:anywhere; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px;
           font-weight:600; margin-left:6px; vertical-align:1px; }
  .b-official { background:#123e29; color:var(--green); }
  .b-prov { background:#443311; color:var(--amber); }
  .b-live { background:#12303e; color:var(--blue); }
  .big { font-size:26px; font-weight:700; }
  .pos { color:var(--green); } .neg { color:var(--red); }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums;
          table-layout:fixed; }
  th,td { padding:3px 2px; text-align:right; font-size:12px; overflow:hidden;
          text-overflow:ellipsis; white-space:nowrap; }
  th { color:var(--dim); font-weight:500; border-bottom:1px solid var(--line); }
  td:first-child,th:first-child { text-align:left; }
  .tot td { border-top:1px solid var(--line); font-weight:600; }
  .tot td[colspan] { text-align:left; white-space:normal; }
  td.mut { color:#3c5169; }
  td.nk, th.nk { width:15%; }                           /* N = naked (futures-equivalent) */
  th.k, td.k { width:22%; }
  .sum { margin-top:6px; border-top:1px solid var(--line); padding-top:6px; }
  /* สองตารางข้างกันเหมือนจอ PC — บนมือถือแนวตั้งต้องบีบตัวอักษรลง (10 คอลัมน์ใน ~370px)
     จึงตัดคอมมาหลักพันของ Strike ออกและลด padding แทนที่จะยอมให้ตัวเลขโดนตัด */
  .pos-two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .pos-two table { font-size:10.5px; }
  .pos-two th, .pos-two td { padding:2px 1px; font-size:10.5px; }
  .pos-two .sum { font-size:11px; }
  .pos-h { color:var(--tx); font-size:12px; font-weight:600; margin-bottom:2px; }
  /* ระยะ strike เท่าจอ PC: โชว์ ~9 แถวแล้วเลื่อนดูส่วนที่เหลือ โดยเปิดมาให้ ATM อยู่กลางช่อง
     (จอ PC ใช้ช่องเลื่อนสูงเท่านี้ + focus ที่ ATM — ถ้าปล่อยยาวทั้ง 26 แถวจะหาแถวที่สนใจไม่เจอ) */
  .tbox { max-height:186px; overflow-y:auto; overscroll-behavior:contain; }
  .tbox::-webkit-scrollbar { width:4px; }
  .tbox::-webkit-scrollbar-thumb { background:#2b455e; border-radius:4px; }
  .pos-two th { position:sticky; top:0; background:var(--card); z-index:1; }
  /* Orders ของวันนั้น — พับเก็บได้ บางวันมีหลายสิบดีล ไม่ควรดันการ์ดอื่นตกจอ (เหมือนจอ PC) */
  .deal-head { width:100%; text-align:left; background:transparent; border:0; padding:0;
               color:var(--dim); font-size:12px; }
  .deals { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px 10px; }
  .deal { font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap;
          background:#0f1a26; border:1px solid var(--line); border-radius:6px; padding:2px 6px; }
  .deal b { font-weight:600; }
  /* จอแคบ (มือถือแนวตั้ง) = เรียงลงมาเหมือนเดิม — 10 คอลัมน์ใน 390px อ่านไม่ออก
     จอกว้างพอ (หมุนมือถือแนวนอน / แท็บเล็ต / เปิดบนคอม) = วางแบบจอ PC:
     กราฟ Payoff ซ้าย · Position Summary ขวา */
  .cols { display:block; }
  @media (min-width:760px) {
    body { max-width:1180px; margin:0 auto; }
    .cols { display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start; }
    svg { height:230px; }
  }
  tr.atm td { background:#182c3f; }
  #err { color:var(--red); white-space:pre-wrap; }
  button, select { background:#1d3040; color:var(--tx); border:1px solid var(--line);
                   border-radius:8px; padding:7px 12px; font-size:13px; }
  svg { width:100%; height:190px; display:block; }
  /* account picker + day stepper — สำเนาของเมนู [Payoff][▾] และปุ่ม ◀ วันที่ ▶ บนจอ PC
     (ไวยากรณ์เดียวกัน: 🗄 = อ่านจาก ledger บน GitHub ซึ่งเป็นทางเดียวที่มือถือมี) */
  .acct-row { position:relative; margin-top:8px; display:flex; gap:8px; align-items:center;
              flex-wrap:wrap; }
  .acct { padding:6px 10px; font-size:13px; display:inline-flex; align-items:center; gap:6px; }
  .acct .caret { font-size:16px; line-height:12px; color:var(--blue); }
  .menu { position:absolute; z-index:5; top:calc(100% + 4px); left:0; min-width:min(300px,92vw);
          background:var(--card); border:1px solid var(--line); border-radius:10px;
          box-shadow:0 8px 24px rgba(0,0,0,0.55); overflow:hidden; }
  .menu-item { display:block; width:100%; text-align:left; border:0; border-radius:0;
               border-bottom:1px solid var(--line); padding:11px 12px; font-size:13px;
               background:transparent; }
  .menu-item:last-child { border-bottom:0; }
  .menu-item:active { background:#1d3040; }
  .menu-sub { color:var(--dim); font-size:11px; }
  .menu-empty { padding:11px 12px; color:var(--dim); font-size:12px; }
  .day-row { display:flex; gap:6px; align-items:center; margin-top:8px; }
  .day-row select { flex:1; text-align:center; }
  .day-row button { padding:7px 14px; }
  .day-row button:disabled { opacity:0.35; }
  #setup input { width:100%; background:#0f1a26; color:var(--tx); border:1px solid var(--line);
                 border-radius:8px; padding:9px 10px; font-size:13px; }
  #setuplist { margin-top:8px; }
  /* token ใกล้หมดอายุ — ต้องเห็นก่อนวันตาย ไม่ใช่รู้ตอนหน้าเปิดไม่ได้แล้ว */
  #tokwarn { display:none; border-radius:10px; padding:9px 12px; margin-bottom:10px;
             font-size:12.5px; line-height:1.5; }
  #tokwarn.warn { background:#3a2c10; border:1px solid #6b5320; color:var(--amber); }
  #tokwarn.crit { background:#3d1518; border:1px solid #7a2a2f; color:var(--red); }
  #tokwarn a { color:inherit; }
</style>
</head>
<body>
<div id="tokwarn"></div>
<div class="card">
  <h1>SET50 Options <span id="badge"></span></h1>
  <div class="dim" id="meta">loading…</div>
  <div class="acct-row">
    <button id="acctbtn" class="acct" hidden>
      🗄 <span id="acctlbl"></span><span class="caret">▾</span>
    </button>
    <div id="acctmenu" class="menu" hidden></div>
  </div>
  <div class="day-row" id="dayrow" hidden>
    <button id="prev" title="วันก่อนหน้า">◀</button>
    <select id="days"></select>
    <button id="next" title="วันถัดไป">▶</button>
  </div>
</div>
<div class="card" id="totcard" hidden>
  <div class="dim" id="nettitle">Net M2M</div>
  <div class="big" id="net"></div>
  <div class="dim" id="netsub"></div>
  <div class="dim" id="besub"></div>
</div>
<div class="cols">
<div>
<div class="card" id="paycard" hidden>
  <div class="dim" style="margin-bottom:4px">Payoff · As of Today — expiry (solid) · T+0 (dashed)</div>
  <svg id="pay" preserveAspectRatio="none"></svg>
  <div class="dim" id="paysub"></div>
</div>
<div class="card" id="todaycard" hidden>
  <div class="dim" style="margin-bottom:4px">Payoff · Today — เฉพาะดีลที่ยิงวันนั้น</div>
  <svg id="todaypay" preserveAspectRatio="none"></svg>
  <div class="dim" id="todaysub"></div>
</div>
</div>
<div>
<div class="card" id="tblcard" hidden>
  <div class="dim" style="margin-bottom:6px">Position Summary — marks at <span id="marklbl"></span></div>
  <div class="pos-two">
    <div id="asofcol">
      <div class="pos-h">As of Today</div>
      <div class="tbox" id="tbox1"><table id="tbl"></table></div>
      <div class="dim" id="asofsum"></div>
    </div>
    <div id="tradedcard">
      <div class="pos-h">Today</div>
      <div class="tbox" id="tbox2"><table id="tbl2"></table></div>
      <div class="dim" id="tradedsum"></div>
    </div>
  </div>
</div>
<div class="card" id="dealcard" hidden>
  <button id="dealhead" class="deal-head"></button>
  <div id="deals" class="deals" hidden></div>
</div>
<div class="card" id="setup" hidden>
  <div class="dim" style="margin-bottom:6px">
    เครื่องนี้ยังไม่เคยตั้งค่า — วาง<b>ลิงก์จาก QR</b> (หน้า <code>เปิดหน้ามือถือ.html</code>
    บนเดสก์ท็อปเครื่องเทรด) ลงช่องนี้ครั้งเดียว แล้วกดบันทึก
  </div>
  <input id="setupval" type="text" inputmode="url" autocomplete="off" spellcheck="false"
         placeholder="https://set50-relay.onrender.com/view?acct=…&key=…">
  <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
    <button id="setupsave">บันทึก</button>
    <span class="dim" id="setupmsg"></span>
  </div>
  <div id="setuplist"></div>
</div>
</div>
</div>
<div class="card"><button onclick="location.reload()">Refresh</button>
  <span class="dim" id="err"></span></div>
<script>
"use strict";
const qs = new URLSearchParams(location.search);
for (const k of ["acct", "key"]) {
  if (qs.get(k)) localStorage.setItem("sv_" + k, qs.get(k));
}
let ACCT = qs.get("acct") || localStorage.getItem("sv_acct") || "";
let HKEY = localStorage.getItem("sv_hkey") || "";     // "<ชื่อเล่น>::<บัญชี>::<ซีรีส์>"
let HSERIES = "";                                    // ซีรีส์ของคีย์ที่เลือก (จับคู่กับข้อมูลสด)
let DATE = "";
const KEY = qs.get("key") || localStorage.getItem("sv_key") || "";
const $ = (id) => document.getElementById(id);
const fmt = (v, d) => v == null ? "-" : v.toLocaleString("en-US",
  { minimumFractionDigits: d ?? 2, maximumFractionDigits: d ?? 2 });
const cls = (v) => v > 0 ? "pos" : v < 0 ? "neg" : "";
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/* M2M ของ snapshot — แหล่งเดียว (พอร์ตจาก dashboard_data._rec_m2m):
   ของจริง = ค่าที่ปักตอนกด M2M Save · ไม่เคยกด Save = ค่าที่เขียนล่าสุด */
const recM2M = (rec) => (rec.m2mSaved != null ? rec.m2mSaved : rec.m2m);
const api = (p) => fetch(p + (p.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(KEY));

/* GitHub บอกวันหมดอายุของ token มากับ header ของทุก response อยู่แล้ว → relay ส่งต่อเป็น
   X-Token-Days/X-Token-Exp กับ call ที่หน้านี้ยิงอยู่แล้ว = ไม่มี request เพิ่ม
   วันที่ token หมด หน้านี้ดับทันที (อ่าน repo private ไม่ได้) จึงต้องเตือนล่วงหน้า 7 วัน */
function tokenWarn(resp) {
  const d = resp && resp.headers.get("X-Token-Days");
  if (d == null) return;
  const days = Number(d), exp = resp.headers.get("X-Token-Exp") || "";
  if (!Number.isFinite(days) || days > 7) return;
  const el = $("tokwarn");
  el.className = days < 0 ? "crit" : "warn";
  el.innerHTML = (days < 0
      ? `⛔ GitHub token <b>หมดอายุแล้ว</b> (${exp}) — หน้านี้จะไม่มีข้อมูลใหม่จนกว่าจะต่ออายุ`
      : `⚠️ GitHub token หมดอายุใน <b>${days} วัน</b> (${exp}) — ต่ออายุก่อน ไม่งั้นหน้านี้ดับ`)
    + `<br>ต่อที่แดชบอร์ดเครื่องเทรด: ⚙ Settings → การ์ด Usage → ปุ่ม <b>Renew token</b>`;
  el.style.display = "block";
}

/* ── Black-76 (พอร์ตมาจาก backend/set50_options.py) ────────────────────────────
   ใช้กับเส้น T+0 ของการ์ด "Today" อย่างเดียว: snapshot เก็บเส้น As-of ที่คิดเสร็จแล้ว (pts)
   แต่ไม่ได้เก็บเส้นของ Today ⇒ ต้องคิดเองตรงนี้จาก todayLegs · ตัวเลขต้องตรงกับจอ PC
   จึงคัดลอกทั้งสูตรและค่าคงที่ R มา แล้วเทียบกับ /payoff-history ของเครื่องเทรดตอนเทส */
const R = 0.0175;
function erf(x) {                       // Abramowitz-Stegun 7.1.26 (|err| < 1.5e-7)
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t - 0.284496736) * t
                 + 0.254829592) * t * Math.exp(-x * x);
  return s * y;
}
const N = (x) => 0.5 * (1 + erf(x / Math.SQRT2));
function black76(F, K, T, sigma, cp) {
  if (T <= 0 || sigma <= 0) {
    return Math.max(0, cp === "C" ? F - K : K - F) * Math.exp(-R * T);
  }
  const vt = sigma * Math.sqrt(T);
  const d1 = (Math.log(F / K) + 0.5 * sigma * sigma * T) / vt, d2 = d1 - vt;
  const dfr = Math.exp(-R * T);
  return cp === "C" ? dfr * (F * N(d1) - K * N(d2)) : dfr * (K * N(-d2) - F * N(-d1));
}
/* legs = [K, cp, lq, lavg, sq, savg, sigma, adj] · fut = [lq, lavg, sq, savg] */
function payoffPoints(legs, fut, prices, T, commPt) {
  const f = fut && fut.length === 4 ? fut : [0, 0, 0, 0];
  const flq = f[0], flavg = f[1], fsq = f[2], fsavg = f[3];
  return prices.map((S) => {
    let e = 0, n = 0;
    for (const lg of legs) {
      const K = lg[0], cp = lg[1], lq = lg[2], lavg = lg[3], sq = lg[4], savg = lg[5],
            sigma = lg[6], adj = lg[7];
      const intr = Math.max(0, cp === "C" ? S - K : K - S);
      e += (intr - lavg) * lq - (intr - savg) * sq;
      // ราคาขา T+0 = โมเดล + basis จาก mark จริง (ห้ามติดลบ — ปีกไกล adj ลบอาจกดต่ำกว่า 0)
      const val = T > 0 ? Math.max(0, black76(S, K, T, sigma, cp) + adj) : intr;
      n += (val - lavg) * lq - (val - savg) * sq;
    }
    if (flq > 1e-9 || fsq > 1e-9) {
      const fv = (S - flavg) * flq - (S - fsavg) * fsq;
      e += fv; n += fv;
    }
    return [S, e - commPt, n - commPt];
  });
}

/* ── data ─────────────────────────────────────────────────────────────────── */
async function loadIndex() {
  const r = await api(`/api/hist?acct=${encodeURIComponent(ACCT)}`);
  tokenWarn(r);
  const d = await r.json();
  if (!r.ok || !d.ok) throw new Error(d.error || "HTTP " + r.status);
  const keys = d.keys || [];
  if (!keys.length) throw new Error(`บัญชี ${ACCT} ยังไม่ได้แชร์ประวัติขึ้น GitHub`);
  const k = keys.find((x) => x.key === HKEY) || keys[0];
  HKEY = k.key;
  localStorage.setItem("sv_hkey", HKEY);
  HSERIES = k.series || "";
  $("acctlbl").textContent = (k.profile || k.acct) + (k.series ? " · " + k.series : "");
  $("acctbtn").hidden = false;
  // ใหม่สุดอยู่บนสุด — เปิดหน้ามาต้องได้วันล่าสุดเสมอ (เหมือนกดปุ่ม Payoff บนจอ PC)
  const days = [...k.days].sort().reverse();
  $("days").innerHTML = days.map((x) => `<option value="${esc(x)}">${esc(x)}</option>`).join("");
  DATE = days.includes(DATE) ? DATE : days[0];
  $("days").value = DATE;
  $("dayrow").hidden = false;
  window._days = days;
}

async function loadDay() {
  const r = await api(`/api/hist?acct=${encodeURIComponent(ACCT)}` +
                      `&hkey=${encodeURIComponent(HKEY)}&date=${encodeURIComponent(DATE)}`);
  tokenWarn(r);
  const d = await r.json();
  if (!r.ok || !d.ok) throw new Error(d.error || "HTTP " + r.status);
  render(d);
}

function render(d) {
  const rec = d.rec, g = rec.greeks || {};
  const F = rec.F, T = rec.T || 0;
  const final = !!rec.final;
  $("badge").className = "badge " + (final ? "b-official" : "b-prov");
  $("badge").textContent = final ? "SETTLE" : "PROVISIONAL";
  const counts = (rec.counts || {}).asOf || {};
  $("meta").textContent = `${d.acct} · ${d.series} · ${d.date}`
    + ` · F ${fmt(F, 1)} · ${fmt(T * 365, 0)}d to expiry`
    + (rec.savedAt ? ` · saved ${rec.savedAt}` : "")
    + (counts.orders != null ? ` · ${counts.orders} orders | ${counts.cons} cons` : "");

  // M2M "ที่ยึดเป็นของจริง" = ค่าที่ปักตอนกด M2M Save (m2mSaved) — ผู้ใช้กำหนดไว้ 2026-08-18
  // และเป็นตัวที่การ์ด Position Summary บนจอ PC โชว์ · m2mSettle = ตัวเทียบตอน settle ทางการ
  // ⚠️ เคยหยิบ m2mSettle มาเป็นเลขหลัก → มือถือขึ้น 238.30 ขณะที่จอ PC ขึ้น 227.4 (2026-08-21)
  const net = recM2M(rec);
  $("nettitle").textContent = "Net M2M (ปักตอน M2M Save · หลังหักคอม)";
  $("net").textContent = fmt(net);
  $("net").className = "big " + cls(net);
  $("netsub").innerHTML = greekLine(g)
    + (rec.m2mSettle != null && rec.m2mSettle !== net ? " · at settle " + fmt(rec.m2mSettle) : "");
  $("besub").innerHTML = beHTML(g.beLower, g.beLoDir, g.beUpper, g.beHiDir);
  $("totcard").hidden = false;

  // As-of: เส้นที่เครื่องเทรดคำนวณไว้แล้ว (ไม่คิดใหม่ = ตรงกับจอ PC แน่นอน)
  const pts = (rec.pts || []).map((p) => (Array.isArray(p) ? p : [p.price, p.exp, p.now]));
  drawPayoff($("pay"), pts, F, g.be || []);
  $("paysub").textContent = pts.length
    ? `range ${fmt(pts[0][0], 0)}–${fmt(pts[pts.length - 1][0], 0)} · P/L at F ${fmt(atF(pts, F))}`
    : "snapshot นี้ไม่มีเส้นกราฟ";
  $("paycard").hidden = false;

  // Today: ดีลของวันนั้นล้วน ๆ — snapshot ไม่ได้เก็บเส้นไว้ จึงคิดจาก todayLegs ตรงนี้
  const tLegs = rec.todayLegs || [], tFut = rec.todayFut || [0, 0, 0, 0];
  const hasToday = tLegs.length || tFut[0] > 1e-9 || tFut[2] > 1e-9;
  if (hasToday && pts.length) {
    const comm = (rec.todayCons || 0) * (rec.commPt || 0);
    const tp = payoffPoints(tLegs, tFut, pts.map((p) => p[0]), T, comm);
    drawPayoff($("todaypay"), tp, F, []);
    const deals = (rec.todayDeals || []).length;
    $("todaysub").textContent = `P/L at F ${fmt(atF(tp, F))}`
      + ` · ${deals} deal${deals === 1 ? "" : "s"} · ${fmt(rec.todayCons || 0, 0)} cons`;
    $("todaycard").hidden = false;
  } else {
    $("todaycard").hidden = true;
  }

  positionTables(rec, F, final);
}

/* greeks + breakeven ของ "ฝั่ง Traded" — ฝั่ง As-of ใช้ค่าที่เครื่องเทรดแช่ไว้ใน snapshot
   แต่ฝั่ง Traded ไม่ได้แช่ไว้ ⇒ คิดใหม่จาก todayLegs ด้วยสูตรเดียวกับ dashboard_data
   (_hist_greeks / _be_from_legs / _be_dir_of) แล้วเทียบเลขกับเครื่องเทรดตอนเทส */
const npdf = (x) => Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI);
function b76(F, K, T, sigma, cp) {
  if (T <= 0 || sigma <= 0) {
    const intr = Math.max(0, cp === "C" ? F - K : K - F) * Math.exp(-R * T);
    return { price: intr, delta: 0, gamma: 0, vega: 0, theta: 0 };
  }
  const vt = sigma * Math.sqrt(T);
  const d1 = (Math.log(F / K) + 0.5 * sigma * sigma * T) / vt, d2 = d1 - vt;
  const dfr = Math.exp(-R * T), nd1 = npdf(d1);
  const price = cp === "C" ? dfr * (F * N(d1) - K * N(d2)) : dfr * (K * N(-d2) - F * N(-d1));
  return {
    price: price,
    delta: cp === "C" ? dfr * N(d1) : -dfr * N(-d1),
    gamma: dfr * nd1 / (F * vt),
    vega: F * dfr * nd1 * Math.sqrt(T),
    theta: -F * dfr * nd1 * sigma / (2 * Math.sqrt(T)) - R * price,
  };
}
// P/L ณ วันหมดอายุ (intrinsic ล้วน ไม่เรียก B76) ที่ราคา S หักคอมรวมแล้ว
function expPnl(legs, fut, S, comm) {
  const f = fut && fut.length === 4 ? fut : [0, 0, 0, 0];
  let e = 0;
  for (const lg of legs) {
    const intr = Math.max(0, lg[1] === "C" ? S - lg[0] : lg[0] - S);
    e += (intr - lg[3]) * lg[2] - (intr - lg[5]) * lg[4];
  }
  if (f[0] > 1e-9 || f[2] > 1e-9) e += (S - f[1]) * f[0] - (S - f[3]) * f[2];
  return e - comm;
}
/* เส้น expiry เป็น piecewise-linear หักมุมเฉพาะที่ strike ⇒ ประเมินแค่ที่ strike + ขอบ F±400
   แล้ว interpolate ตรงช่วง = แม่นและถูก (ไม่ต้องสแกนถี่) — สูตรเดียวกับ _be_from_legs */
function beFromLegs(legs, fut, F, comm) {
  const f = fut && fut.length === 4 ? fut : [0, 0, 0, 0];
  if (!legs.length && f[0] < 1e-9 && f[2] < 1e-9) return [];
  const ks = [...new Set(legs.map((l) => l[0]))].sort((a, b) => a - b);
  const all = [...new Set([Math.min(...ks.concat([F])) - 400, ...ks,
                           Math.max(...ks.concat([F])) + 400])].sort((a, b) => a - b);
  const es = all.map((x) => expPnl(legs, f, x, comm));
  const out = [];
  const r1 = (v) => Math.round(v * 10) / 10;
  for (let i = 1; i < all.length; i++) {
    const a = all[i - 1], ea = es[i - 1], b = all[i], eb = es[i];
    if (ea === 0) out.push(r1(a));
    else if (eb !== 0 && (ea < 0) !== (eb < 0)) out.push(r1(a + (b - a) * (-ea) / (eb - ea)));
  }
  if (es.length && es[es.length - 1] === 0) out.push(r1(all[all.length - 1]));
  const ded = [];
  for (const v of out) if (!ded.length || Math.abs(ded[ded.length - 1] - v) > 0.05) ded.push(v);
  return ded;
}
const beDir = (legs, fut, F, b, comm) => {
  if (!b) return "";
  const side = b > F ? 1 : -1;
  return expPnl(legs, fut, b + side * 3, comm) < expPnl(legs, fut, b - side * 3, comm)
    ? "down" : "up";
};
function histGreeks(legs, fut, F, T) {
  const f = fut && fut.length === 4 ? fut : [0, 0, 0, 0];
  let dlt = 0, gmm = 0, veg = 0, tht = 0;
  for (const lg of legs) {
    const r = b76(F, lg[0], T, lg[6], lg[1]);
    const n = lg[2] - lg[4];
    dlt += r.delta * n; gmm += r.gamma * n;
    veg += (r.vega / 100) * n; tht += (r.theta / 365) * n;
  }
  dlt += f[0] - f[2];                       // futures: Δ=1/สัญญา · Γ/Vega/Θ = 0
  return { delta: dlt, gamma: gmm, vega: veg, theta: tht };
}

/* ── Position Summary แบบเดียวกับจอ PC ────────────────────────────────────────
   พอร์ตมาจาก dashboard_data._hist_position_tables: ตาราง As-of สร้างจาก entries ·
   ตาราง Traded สร้างจาก todayDeals · คอลัมน์ N = "naked" = ความชันของเส้น payoff ที่
   expiry (จำนวนสัญญา futures เทียบเท่าในโซนนั้น) · หน้าต่าง strike ของสองตารางคิดแยกกัน
   เหมือนจอสด · ตรวจว่าตรงกับ /payoff-history ของเครื่องเทรดทุกช่องแล้ว */
const STEP = 10;
const legQC = (t, long) => {                    // [lq,lval,sq,sval] -> [qty, avgCost]
  const q = long ? t[0] : t[2], v = long ? t[1] : t[3];
  return [Math.round(q), q > 1e-9 ? Math.round((v / q) * 100) / 100 : 0];
};
function nakedSlope(legs, futQty) {             // legs: Map "K|cp" -> net qty (มีเครื่องหมาย)
  const calls = [], puts = [];
  for (const [kc, q] of legs) {
    if (!q) continue;
    const parts = kc.split("|");
    (parts[1] === "C" ? calls : puts).push([Number(parts[0]), q]);
  }
  return (S) => {
    let s = futQty;
    for (const kq of calls) if (kq[0] < S) s += kq[1];
    for (const kq of puts) if (kq[0] > S) s -= kq[1];
    return s;
  };
}
// N ซ้าย (ฝั่ง call) โชว์เมื่อ K >= ATM · N ขวา (ฝั่ง put) โชว์เมื่อ K <= ATM · ที่ ATM โชว์ทั้งคู่
const nakedFor = (K, slope, atm) => [
  K >= atm ? Math.round(slope(K + 5)) : null,
  K <= atm ? Math.round(-slope(K - 5)) : null,
];
function displayStrikes(posKeys, F, target) {
  target = target || 8;
  const atm = Math.round(F / STEP) * STEP;
  const strikes = [...posKeys].sort((a, b) => a - b);
  const have = new Set(strikes);
  for (let off = 0; strikes.length < target; off++) {
    const cand = off === 0 ? [atm] : [atm + off * STEP, atm - off * STEP];
    for (const k of cand) {
      if (!have.has(k) && strikes.length < target) { have.add(k); strikes.push(k); }
    }
  }
  return strikes.sort((a, b) => a - b);
}
function tableHTML(rows, tfex, atm) {
  // สีเดียวกับจอ PC: บวก (long) เขียว · ลบ (short) แดง — ดูออกทันทีว่าถือฝั่งไหน
  const cell = (v, c) => (v ? '<td class="' + (c || "") + " " + cls(v) + '">' + v + "</td>"
                            : '<td class="mut">·</td>');
  const out = ['<tr><th class="nk">N</th><th>C</th><th class="k">Strike</th><th>P</th>'
               + '<th class="nk">N</th></tr>'];
  if (tfex) {
    out.push('<tr><td class="mut">·</td>' + cell(tfex)
             + '<td class="k">TFEX</td><td class="mut">·</td><td class="mut">·</td></tr>');
  }
  for (const r of rows) {
    out.push("<tr" + (r.K === atm ? ' class="atm"' : "") + ">"
      + cell(r.nl, "nk") + cell(r.c) + '<td class="k">' + Math.round(r.K) + "</td>"
      + cell(r.p) + cell(r.nr, "nk") + "</tr>");
  }
  return out.join("");
}
/* เปิดมาแล้วต้องเห็นโซน ATM ทันทีเหมือนจอ PC (ที่ตั้ง focus ไว้ที่ ATM) — ไม่ใช่ให้ผู้ใช้
   เลื่อนหาเองจากบนสุด · เผื่อไม่มีแถว ATM (พอร์ตอยู่ปีกเดียว) ใช้แถวที่ใกล้ ATM ที่สุด */
/* สีตามจอ PC: ค่า greek บวก = เขียว · ลบ = แดง (ทุกตัว รวม M2M) ·
   BE ลงสีเฉพาะ "ลูกศร" (↓ แดง = short vol · ↑ เขียว = long vol) ตัวเลขคงสีปกติ
   — ดู PositionSummary.tsx ฟังก์ชัน BE() ที่จอ PC ใช้ */
const gv = (v, d) => '<b class="' + cls(v) + '">' + fmt(v, d) + "</b>";
const greekLine = (g) => "Δ " + gv(g.delta) + " Γ " + gv(g.gamma) + " V " + gv(g.vega)
  + " Θ " + gv(g.theta);
function beHTML(lower, loDir, upper, hiDir) {
  const one = (v, d) => {
    if (!v) return "";
    const a = d === "down" ? "↓" : d === "up" ? "↑" : "";
    return (a ? '<span class="' + (d === "down" ? "neg" : "pos") + '">' + a + "</span>" : "")
      + fmt(v, 1);
  };
  const parts = [one(lower, loDir), one(upper, hiDir)].filter(Boolean);
  return parts.length ? "BE " + parts.join(" ") : "";
}

function focusATM(boxId, atm) {
  const box = $(boxId);
  if (!box) return;
  const rows = [...box.querySelectorAll("tr")].slice(1);
  let best = null, bd = Infinity;
  for (const tr of rows) {
    const k = Number((tr.children[2] || {}).textContent);
    if (!Number.isFinite(k)) continue;
    const d = Math.abs(k - atm);
    if (d < bd) { bd = d; best = tr; }
  }
  if (!best) return;
  box.scrollTop = Math.max(0, best.offsetTop - box.clientHeight / 2 + best.clientHeight / 2);
}

function positionTables(rec, F, final) {
  const ents = rec.entries || [];
  const atm = Math.round(F / STEP) * STEP;
  // ── As of: รวมขาต่อ (strike, C/P) จาก entries
  const asof = new Map(), marks = new Map();
  const aTfex = [0, 0, 0, 0];
  for (const e of ents) {
    const leg = e.leg || "", q = Math.abs(Number(e.qty) || 0), cost = Number(e.cost) || 0;
    const i = leg.charAt(0) === "L" ? 0 : 2;
    if (leg === "LF" || leg === "SF") { aTfex[i] += q; aTfex[i + 1] += q * cost; continue; }
    const kc = (Number(e.strike) || 0) + "|" + leg.slice(1);
    const t = asof.get(kc) || [0, 0, 0, 0];
    t[i] += q; t[i + 1] += q * cost;
    asof.set(kc, t);
    if (e.mark != null) marks.set(kc, e.mark);
  }
  // ── Traded: net ต่อ (strike, C/P) จากดีลดิบของวันนั้น
  const tdy = new Map();
  let tFutNet = 0;
  const tDeals = rec.todayDeals || [];
  for (const dl of tDeals) {
    const q = Number(dl.qty) || 0, px = Number(dl.price) || 0;
    if (dl.leg === "TFEX") { tFutNet += q; continue; }
    const m = String(dl.leg).match(/^(\d+(?:\.\d+)?)-([CP])$/);
    if (!m) continue;
    const kc = Number(m[1]) + "|" + m[2];
    const c = tdy.get(kc) || { net: 0, deals: [] };
    c.net += q; c.deals.push([q, px]);
    tdy.set(kc, c);
  }
  const netOf = (t) => legQC(t, true)[0] - legQC(t, false)[0];
  const aLegs = new Map(), tLegs = new Map();
  for (const [kc, t] of asof) { const n = netOf(t); if (n) aLegs.set(kc, n); }
  for (const [kc, c] of tdy) if (c.net) tLegs.set(kc, c.net);
  const aFut = legQC(aTfex, true)[0] - legQC(aTfex, false)[0];
  const aSlope = nakedSlope(aLegs, aFut), tSlope = nakedSlope(tLegs, tFutNet);
  const kset = (legs, cells) => {
    const ks = new Set();
    for (const kc of legs.keys()) ks.add(Number(kc.split("|")[0]));
    // ขาที่เทรดกลับหมดวันนั้น (net 0 แต่มีดีล) ต้องคงแถวไว้ — ตรงกับจอสด
    if (cells) for (const [kc, c] of cells) if (c.deals.length) ks.add(Number(kc.split("|")[0]));
    return ks;
  };
  const build = (strikes, slope, get) => strikes.map((K) => {
    const n = nakedFor(K, slope, atm);
    return { K: K, nl: n[0], nr: n[1], c: get(K, "C"), p: get(K, "P") };
  });
  const aRows = build(displayStrikes(kset(aLegs), F), aSlope,
                      (K, cp) => netOf(asof.get(K + "|" + cp) || [0, 0, 0, 0]));
  const tRows = build(displayStrikes(kset(tLegs, tdy), F), tSlope,
                      (K, cp) => (tdy.get(K + "|" + cp) || { net: 0 }).net);
  $("marklbl").textContent = (ents[0] || {}).src || (final ? "settle" : "close");
  $("tbl").innerHTML = tableHTML(aRows, aFut, atm);
  const cA = (rec.counts || {}).asOf || { orders: ents.length, cons: Math.round(rec.cons || 0) };
  const g = rec.greeks || {};
  const netA = recM2M(rec);
  const aBe = beHTML(g.beLower, g.beLoDir, g.beUpper, g.beHiDir);
  $("asofsum").innerHTML = '<div class="sum">' + cA.orders + " orders | " + cA.cons + " cons<br>"
    + "M2M " + gv(netA) + " · " + greekLine(g) + (aBe ? "<br>" + aBe : "") + "</div>";
  $("tblcard").hidden = ents.length === 0;
  focusATM("tbox1", atm);

  // M2M ฝั่ง Traded = (มาร์คของวันนั้น − ราคาที่เทรด) × qty (มาร์คชุดเดียวกับ As-of) − คอม
  let tM2M = 0;
  for (const [kc, c] of tdy) {
    const mk = marks.get(kc);
    if (mk != null) for (const d of c.deals) tM2M += (mk - d[1]) * d[0];
  }
  for (const dl of tDeals) {
    if (dl.leg === "TFEX") tM2M += (F - (Number(dl.price) || 0)) * (Number(dl.qty) || 0);
  }
  const tComm = (rec.todayCons || 0) * (rec.commPt || 0);
  $("tbl2").innerHTML = tableHTML(tRows, tFutNet, atm);
  // greeks/BE ฝั่ง Traded ไม่ได้แช่ไว้ใน snapshot ⇒ คิดจาก todayLegs ด้วยสูตรเดียวกับจอ PC
  const tl = rec.todayLegs || [], tf = rec.todayFut || [0, 0, 0, 0];
  const tg = histGreeks(tl, tf, F, rec.T || 0);
  const tbe = beFromLegs(tl, tf, F, tComm);
  const tLo = tbe.filter((v) => v < F), tHi = tbe.filter((v) => v > F);
  const tbeHTML = beHTML(tLo.length ? Math.max(...tLo) : 0,
                         beDir(tl, tf, F, tLo.length ? Math.max(...tLo) : 0, tComm),
                         tHi.length ? Math.min(...tHi) : 0,
                         beDir(tl, tf, F, tHi.length ? Math.min(...tHi) : 0, tComm));
  $("tradedsum").innerHTML = '<div class="sum">' + tDeals.length + " orders | "
    + Math.round(rec.todayCons || 0) + " cons<br>M2M " + gv(tM2M - tComm) + " · " + greekLine(tg)
    + (tbeHTML ? "<br>" + tbeHTML : "") + "</div>";
  $("tradedcard").hidden = tDeals.length === 0;
  $("tblcard").hidden = false;
  focusATM("tbox2", atm);
  renderDeals(tDeals);
}

/* Orders ที่ยิงในวันที่กำลังย้อนดู (ดีลดิบที่แช่ไว้กับ snapshot ตอน M2M Save) — บวก=ซื้อ ลบ=ขาย
   พับเก็บไว้ก่อนเหมือนจอ PC เพราะบางวันหลายสิบดีล */
function renderDeals(deals) {
  $("dealcard").hidden = !deals.length;
  if (!deals.length) return;
  const ct = deals.reduce((a, d) => a + Math.abs(Number(d.qty) || 0), 0);
  const box = $("deals");
  box.hidden = true;
  $("dealhead").innerHTML = "▸ Orders · " + deals.length + " deal" + (deals.length > 1 ? "s" : "")
    + " · " + ct + " ct";
  box.innerHTML = deals.map((d) => {
    const q = Number(d.qty) || 0;
    return '<span class="deal">' + esc(d.leg) + ' <b class="' + cls(q) + '">'
      + (q > 0 ? "+" : "") + q + "</b> @ " + fmt(d.price, 1) + "</span>";
  }).join("");
  $("dealhead").onclick = () => {
    box.hidden = !box.hidden;
    $("dealhead").innerHTML = (box.hidden ? "▸" : "▾") + " Orders · " + deals.length
      + " deal" + (deals.length > 1 ? "s" : "") + " · " + ct + " ct";
  };
}


/* ── โหมด LIVE (วันนี้ ตอนนี้) ────────────────────────────────────────────────
   ประวัติย้อนหลังมาจาก git = ภาพที่ตรึงตอนกด M2M Save ⇒ "วันนี้" ที่ได้จาก git คือภาพ
   ตอน push ครั้งล่าสุด (เช้า) ไม่ใช่ตอนนี้ · ตัวเลขสดต้องมาจากเครื่องเทรดเท่านั้น เพราะ
   M2M ต้องใช้ราคาตลาดปัจจุบันของทุกขา ซึ่งมือถือไม่มีทางรู้เอง
   ระหว่างเวลาเทรด เครื่องเทรด push payoff+positions ที่ "คำนวณเสร็จแล้ว" ขึ้น relay ทุก ~20 วิ
   (relay_mode = relay) ⇒ อ่าน /api/data แล้ววาดตรง ๆ = ตัวเลขชุดเดียวกับที่จอ PC โชว์
   ⚠️ poll เฉพาะตอนบัญชียัง online — เจ้าของหยุด push (ปิดตลาด/ปิดเครื่อง) ต้องเลิก poll
   ทันที ไม่งั้นมือถือจะปลุก relay ค้างไว้กินโควตาฟรีเปล่า ๆ */
let LIVE = null;                 // payload ล่าสุดของบัญชีที่เลือก (null = ไม่มีใคร push)
let liveTimer = null;
let liveUntil = 0;               // หยุด auto-refresh เมื่อถึงเวลานี้ (กันเปิดค้างในกระเป๋า)

/* ── กติกาประหยัดชั่วโมงฟรีของ Render ────────────────────────────────────────────
   Render คิดเงินตาม "เวลาที่ instance ตื่น" ไม่ใช่จำนวน request และมันหลับเมื่อไม่มีใคร
   เรียก 15 นาที ⇒ สิ่งที่แพงคือ "ปลุกไว้นาน ๆ" ไม่ใช่ "ยิงถี่"
     1. ระหว่างเวลาเทรด เครื่องเทรด push ทุก ~20 วิอยู่แล้ว → relay ตื่นอยู่แล้ว
        การ poll ของมือถือในช่วงนี้ **ไม่เพิ่มชั่วโมงเลย**
     2. นอกเวลาเทรด ไม่ยิง /api/data เลย (ไม่มีอะไรใหม่ให้ดูอยู่แล้ว)
     3. สลับแอป/จอดับ = หยุด poll ทันที (visibilitychange) — ตัวที่กินจริงคือหน้าเปิดค้าง
     4. เปิดค้างเกิน 10 นาทีไม่แตะเลย = หยุดเอง แล้วโชว์ปุ่มให้กดอัปเดตเมื่อต้องการ
   ห้ามแหกข้อ 2-4 (กติกาเดียวกับฝั่ง PC: ห้ามปลุก relay นอกเวลาเทรด)                */
const LIVE_EVERY = 30000;        // วิ ระหว่าง refresh ตอนหน้าเปิดอยู่จริง
const LIVE_IDLE_MS = 10 * 60000; // เปิดค้างเงียบ ๆ นานสุดก่อนหยุดเอง
const TRADE_WIN = [[9 * 60 + 45, 12 * 60 + 30], [13 * 60 + 45, 16 * 60 + 55]];
function inTradingHours() {
  const d = new Date();                          // นาฬิกาเครื่อง = เวลาไทยของผู้ใช้
  if (d.getDay() === 0 || d.getDay() === 6) return false;
  const m = d.getHours() * 60 + d.getMinutes();
  return TRADE_WIN.some((w) => m >= w[0] && m <= w[1]);
}

function matchLive(accounts) {
  for (const a of accounts || []) {
    const po = a.positions || {};
    if (!po.asOf) continue;
    const acctOK = po.account ? String(po.account) === String(ACCT) : false;
    const sameSeries = !HSERIES || !po.series || po.series === HSERIES;
    if (acctOK && sameSeries) return a;
  }
  return null;
}

async function loadLive(force) {
  if (!force && !inTradingHours()) return null;   // นอกเวลาเทรด = ไม่มีใคร push อยู่แล้ว
  try {
    const r = await api("/api/data");
    if (!r.ok) return null;
    const d = await r.json();
    const a = matchLive(d.accounts);
    return a && a.online ? a : null;
  } catch (e) {
    return null;                 // relay ล่ม/หลับ = ไม่มี live เฉย ๆ ไม่ใช่ error ของหน้า
  }
}

const ptsOf = (arr) => (arr || []).map((p) => (Array.isArray(p) ? p : [p.price, p.exp, p.now]));
const rowsOf = (t) => (t.rows || []).map((r) => ({
  K: r.strike, nl: r.nakedL, nr: r.nakedR, c: r.callN, p: r.putN,
}));
// ดีลของวันนี้จากตาราง Today (แนบมารายช่องอยู่แล้ว) → รายการเดียวกับแถบ Orders ของ history
function liveDeals(t) {
  const out = [];
  const tf = t.tfex || {};
  for (const d of tf.callDeals || []) out.push({ leg: "TFEX", qty: d.qty, price: d.price });
  for (const r of t.rows || []) {
    for (const d of r.callDeals || []) out.push({ leg: r.label + "-C", qty: d.qty, price: d.price });
    for (const d of r.putDeals || []) out.push({ leg: r.label + "-P", qty: d.qty, price: d.price });
  }
  return out;
}

function renderLive(a) {
  const po = a.positions || {}, pf = a.payoff || {};
  const F = pf.F || 0, atm = Math.round(F / STEP) * STEP;
  const gA = (po.asOf || {}).greeks || {}, gT = (po.today || {}).greeks || {};
  $("badge").className = "badge b-live";
  $("badge").textContent = "LIVE";
  const cnt = po.counts || {};
  $("meta").textContent = `${po.account || ACCT} · ${po.series || ""} · วันนี้`
    + ` · F ${fmt(F, 1)} · ${fmt(pf.days || 0, 0)}d to expiry · อัปเดตเมื่อ ${a.lastBeat} ที่แล้ว`
    + ((cnt.asOf || {}).orders != null ? ` · ${cnt.asOf.orders} orders | ${cnt.asOf.cons} cons` : "");

  $("nettitle").textContent = "Net M2M (สด · หลังหักคอม)";
  $("net").textContent = fmt(gA.m2m);
  $("net").className = "big " + cls(gA.m2m);
  $("netsub").innerHTML = greekLine(gA);
  $("besub").innerHTML = beHTML(gA.beLower, gA.beLoDir, gA.beUpper, gA.beHiDir);
  $("totcard").hidden = false;

  const aPts = ptsOf(pf.asOf), tPts = ptsOf(pf.today);
  drawPayoff($("pay"), aPts, F, gA.be || []);
  $("paysub").textContent = aPts.length
    ? `range ${fmt(aPts[0][0], 0)}–${fmt(aPts[aPts.length - 1][0], 0)}`
      + ` · P/L at F ${fmt(pf.asOfAtF ? pf.asOfAtF.now : atF(aPts, F))}` : "";
  $("paycard").hidden = false;
  if (tPts.length) {
    drawPayoff($("todaypay"), tPts, F, gT.be || []);
    $("todaysub").textContent = `P/L at F ${fmt(pf.todayAtF ? pf.todayAtF.now : atF(tPts, F))}`
      + ` · ${(cnt.today || {}).orders || 0} deals · ${(cnt.today || {}).cons || 0} cons`;
    $("todaycard").hidden = false;
  } else { $("todaycard").hidden = true; }

  const beRow = (g) => beHTML(g.beLower, g.beLoDir, g.beUpper, g.beHiDir);
  $("marklbl").textContent = "live (mid/smile)";
  $("tbl").innerHTML = tableHTML(rowsOf(po.asOf || {}), ((po.asOf || {}).tfex || {}).callN, atm);
  $("asofsum").innerHTML = '<div class="sum">' + ((cnt.asOf || {}).orders || 0) + " orders | "
    + ((cnt.asOf || {}).cons || 0) + " cons<br>M2M " + gv(gA.m2m) + " · " + greekLine(gA)
    + (beRow(gA) ? "<br>" + beRow(gA) : "") + "</div>";
  $("tblcard").hidden = false;
  focusATM("tbox1", atm);

  const tRows = rowsOf(po.today || {});
  $("tbl2").innerHTML = tableHTML(tRows, ((po.today || {}).tfex || {}).callN, atm);
  $("tradedsum").innerHTML = '<div class="sum">' + ((cnt.today || {}).orders || 0) + " orders | "
    + ((cnt.today || {}).cons || 0) + " cons<br>M2M " + gv(gT.m2m) + " · " + greekLine(gT)
    + (beRow(gT) ? "<br>" + beRow(gT) : "") + "</div>";
  $("tradedcard").hidden = tRows.length === 0;
  focusATM("tbox2", atm);
  renderDeals(liveDeals(po.today || {}));
}

/* หยุด auto-refresh (เปิดค้างนานเกินไป) — ไม่ตัดขาด แค่ให้กดเอาเองเมื่ออยากได้ค่าล่าสุด
   เพราะทุกครั้งที่ยิงคือการยืดเวลาที่ relay ตื่น = กินชั่วโมงฟรี */
function liveIdle() {
  clearTimeout(liveTimer);
  $("err").innerHTML = 'หยุดอัปเดตอัตโนมัติแล้ว (เปิดค้างนาน) — '
    + '<b id="liveresume" style="text-decoration:underline">แตะเพื่ออัปเดต</b>';
  const el = $("liveresume");
  if (el) el.onclick = () => { $("err").textContent = ""; liveUntil = Date.now() + LIVE_IDLE_MS; go(); };
}

/* จอดับ/สลับแอป = หยุดยิงทันที · กลับมาดูเมื่อไหร่ค่อยดึงใหม่รอบเดียวแล้วเดินต่อ
   (หน้าเปิดค้างในกระเป๋าแล้วยิงทุก 30 วิ = ปลุก relay ทิ้งไว้ฟรี ๆ ทั้งวัน) */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { clearTimeout(liveTimer); return; }
  if (DATE === "live" && Date.now() < liveUntil) go();
});

/* รีเฟรชเองทุก 30 วิ **เฉพาะตอนดู LIVE และเจ้าของยัง push อยู่** — หยุด push เมื่อไหร่
   (ปิดตลาด/ปิดเครื่อง) เลิก poll ทันทีแล้วสลับไปวันล่าสุดของประวัติ */
function liveLoop() {
  clearTimeout(liveTimer);
  if (DATE !== "live" || document.hidden) return;
  if (Date.now() > liveUntil) { liveIdle(); return; }
  liveTimer = setTimeout(async () => {
    const a = await loadLive();
    if (!a) {
      LIVE = null;
      $("err").textContent = "เจ้าของหยุดส่งข้อมูลสดแล้ว (ปิดตลาด/ปิดเครื่อง) — สลับไปภาพล่าสุดที่บันทึกไว้";
      const days = (window._days || []).filter((d) => d !== "live");
      if (days.length) { DATE = days[0]; $("days").value = DATE; }
      go();
      return;
    }
    LIVE = a;
    renderLive(a);
    liveLoop();
  }, LIVE_EVERY);
}

// P/L ของเส้น T+0 ที่ราคาปัจจุบัน (จุดในกริดที่ใกล้ F ที่สุด — กริดมี F อยู่แล้วเกือบทุกครั้ง)
const atF = (pts, F) => {
  let best = null, bd = Infinity;
  for (const p of pts) { const d = Math.abs(p[0] - F); if (d < bd) { bd = d; best = p; } }
  return best ? best[2] : null;
};

function drawPayoff(sv, pts, F, be) {
  if (!pts || pts.length < 2) { sv.innerHTML = ""; return; }
  const W = 360, H = 190, PAD = 6;
  const xs = pts.map((d) => d[0]);
  const ys = pts.flatMap((d) => [d[1], d[2]]).filter((v) => v != null);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys, 0), y1 = Math.max(...ys, 0);
  const X = (v) => PAD + (v - x0) / (x1 - x0) * (W - 2 * PAD);
  const Y = (v) => H - PAD - (v - y0) / (y1 - y0 || 1) * (H - 2 * PAD);
  const line = (i) => pts.map((d, n) => (n ? "L" : "M") + X(d[0]).toFixed(1) + " " +
    Y(d[i]).toFixed(1)).join(" ");
  sv.setAttribute("viewBox", `0 0 ${W} ${H}`);
  sv.innerHTML =
    `<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="#33506b" stroke-width="1"/>` +
    (be || []).filter((v) => v >= x0 && v <= x1).map((v) =>
      `<line x1="${X(v)}" x2="${X(v)}" y1="0" y2="${H}" stroke="#4a6b8a" stroke-width="0.7"/>`).join("") +
    (F ? `<line x1="${X(F)}" x2="${X(F)}" y1="0" y2="${H}" stroke="#5aa7e0" ` +
         `stroke-width="1" stroke-dasharray="3 3"/>` : "") +
    `<path d="${line(1)}" fill="none" stroke="#37d07c" stroke-width="1.6"/>` +
    `<path d="${line(2)}" fill="none" stroke="#ffc95c" stroke-width="1.2" ` +
    `stroke-dasharray="5 4"/>`;
}

/* ── account picker ───────────────────────────────────────────────────────────
   ทุกพอร์ต/ซีรีส์ที่เคย push ประวัติขึ้น ledger repo (ไม่ใช่เฉพาะที่มี bundle ตอนเย็น)
   เลือกแล้วจำลง localStorage แล้วโหลดใหม่ — key ยังอยู่ ไม่ต้องใส่ซ้ำ */
function pick(acct, hkey) {
  localStorage.setItem("sv_acct", acct);
  if (hkey) localStorage.setItem("sv_hkey", hkey);
  location.href = "/view";
}

async function loadAccounts() {
  const m = $("acctmenu");
  m.innerHTML = '<div class="menu-empty">Loading…</div>';
  try {
    const r = await api("/api/accounts");
    tokenWarn(r);
    const d = await r.json();
    if (!r.ok || !d.ok) throw new Error(d.error || "HTTP " + r.status);
    // พอร์ตที่กำลังดูอยู่มีชื่อบนปุ่มแล้ว — ลิสต์ซ้ำ = แถวที่กดแล้วได้หน้าเดิม (กติกาเดียวกับจอ PC)
    const items = (d.accounts || []).filter((a) => !(a.acct === ACCT && a.histKey === HKEY));
    if (!items.length) {
      m.innerHTML = '<div class="menu-empty">ไม่มีพอร์ตอื่นที่แชร์ไว้</div>';
      return;
    }
    m.innerHTML = items.map((a) =>
      `<button class="menu-item" data-acct="${esc(a.acct)}" data-key="${esc(a.histKey || "")}">` +
      `🗄 ${esc(a.profile || a.acct)}${a.series ? " · " + esc(a.series) : ""}` +
      `<span class="menu-sub"> · ${esc(a.date)}` +
      `${a.hist ? ` · ${a.days} วัน` : " · settle only"}</span></button>`).join("");
    for (const el of m.querySelectorAll(".menu-item")) {
      el.onclick = () => pick(el.dataset.acct, el.dataset.key);
    }
  } catch (e) {
    m.innerHTML = `<div class="menu-empty">โหลดรายชื่อไม่ได้ — ${esc(e.message || e)}` +
      `<br><b>แตะเพื่อลองใหม่</b></div>`;
    m.querySelector(".menu-empty").onclick = loadAccounts;
  }
}

$("acctbtn").onclick = (e) => {
  e.stopPropagation();
  const m = $("acctmenu");
  m.hidden = !m.hidden;
  if (!m.hidden) void loadAccounts();
};
document.addEventListener("click", () => { $("acctmenu").hidden = true; });

/* ── day stepper ── รายการเรียงใหม่→เก่า ⇒ ◀ (ย้อนอดีต) = index +1 */
const step = (dir) => {
  const days = window._days || [];
  const i = days.indexOf(DATE) + dir;
  if (i < 0 || i >= days.length) return;
  DATE = days[i];
  $("days").value = DATE;
  go();
};
$("prev").onclick = () => step(1);
$("next").onclick = () => step(-1);
$("days").onchange = () => { DATE = $("days").value; go(); };

function syncStepper() {
  const days = window._days || [], i = days.indexOf(DATE);
  $("prev").disabled = i >= days.length - 1;
  $("next").disabled = i <= 0;
}

function go() {
  $("err").textContent = "";
  syncStepper();
  if (DATE === "live") {
    liveUntil = Math.max(liveUntil, Date.now() + LIVE_IDLE_MS);
    if (LIVE) { renderLive(LIVE); liveLoop(); return; }
    loadLive(true).then((a) => {
      if (!a) { $("err").textContent = "ยังไม่มีข้อมูลสด (เจ้าของไม่ได้เปิดเครื่อง/นอกเวลาเทรด)"; return; }
      LIVE = a; renderLive(a); liveLoop();
    });
    return;
  }
  clearTimeout(liveTimer);
  loadDay().catch((e) => { $("err").textContent = String(e.message || e); });
}

/* ── ตั้งค่าครั้งแรกบนเครื่องนี้ ────────────────────────────────────────────────
   รับได้ทั้ง "ลิงก์เต็มจาก QR" และ "คีย์เปล่า ๆ" — ใส่คีย์อย่างเดียวก็ไปดึงรายชื่อพอร์ต
   มาให้เลือกต่อได้ทันที (มือถือพิมพ์ยาก ๆ ควรต้องพิมพ์ให้น้อยที่สุด) */
function showSetup(msg) {
  $("meta").textContent = "ยังไม่ได้ตั้งค่าเครื่องนี้";
  $("setup").hidden = false;
  if (msg) $("setupmsg").textContent = msg;
  $("setupsave").onclick = async () => {
    const raw = ($("setupval").value || "").trim();
    if (!raw) return;
    let acct = "", key = raw;
    try {
      const u = new URL(raw);
      acct = u.searchParams.get("acct") || "";
      key = u.searchParams.get("key") || "";
    } catch (e) { /* ไม่ใช่ URL = ถือว่าเป็นคีย์ */ }
    if (!key) { $("setupmsg").textContent = "ลิงก์นี้ไม่มี key"; return; }
    localStorage.setItem("sv_key", key);
    if (acct) { localStorage.setItem("sv_acct", acct); location.href = "/view"; return; }
    // มีแต่คีย์ → ให้เลือกพอร์ตจากรายชื่อจริง
    $("setupmsg").textContent = "กำลังดึงรายชื่อพอร์ต…";
    try {
      const r = await fetch("/api/accounts?key=" + encodeURIComponent(key));
      const d = await r.json();
      if (!r.ok || !d.ok) throw new Error(d.error || "HTTP " + r.status);
      $("setupmsg").textContent = "เลือกพอร์ต:";
      $("setuplist").innerHTML = (d.accounts || []).map((a) =>
        `<button class="menu-item" data-acct="${esc(a.acct)}" data-key="${esc(a.histKey || "")}">` +
        `🗄 ${esc(a.profile || a.acct)}${a.series ? " · " + esc(a.series) : ""}</button>`).join("");
      for (const el of $("setuplist").querySelectorAll(".menu-item")) {
        el.onclick = () => pick(el.dataset.acct, el.dataset.key);
      }
    } catch (e) {
      $("setupmsg").textContent = "คีย์ใช้ไม่ได้: " + (e.message || e);
    }
  };
}

async function main() {
  if (!ACCT || !KEY) { showSetup(); return; }
  await loadIndex();
  // มีคน push อยู่ = เปิดหน้ามาต้องเห็น "ตอนนี้" ก่อน (ตัวเลขชุดเดียวกับจอ PC)
  const a = await loadLive();                 // นอกเวลาเทรดจะไม่ยิงเลย -> ไปที่ประวัติทันที
  if (a) {
    LIVE = a;
    liveUntil = Date.now() + LIVE_IDLE_MS;
    window._days = ["live", ...(window._days || [])];
    const opt = document.createElement("option");
    opt.value = "live";
    opt.textContent = "● ตอนนี้ (live · " + a.lastBeat + ")";
    $("days").prepend(opt);
    DATE = "live";
    $("days").value = "live";
  }
  go();
}
main().catch((e) => {
  const m = String(e.message || e);
  $("err").textContent = m;
  if (/unauthorized|401/i.test(m)) showSetup("คีย์ไม่ถูกต้อง — วางลิงก์จาก QR ใหม่อีกครั้ง");
});
</script>
